<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Govee Charts</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">Govee Charts</div>
    <p class="tagline">Temperature and humidity — local BLE scan</p>
    <p class="node-line" id="node-line" hidden></p>
    <nav class="peer-links" id="peer-links" aria-label="Federation peers" hidden></nav>
    <nav class="views" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-view="overview" class="active" aria-selected="true">Overview</button>
      <button type="button" role="tab" data-view="compare" aria-selected="false">Compare</button>
      <button type="button" id="restart-btn" class="restart-btn" title="Restart service">Restart</button>
    </nav>
    <p class="restart-status" id="restart-status" hidden aria-live="polite"></p>
  </header>

  <main>
    <section id="view-overview" class="view" role="tabpanel" aria-label="Overview">
      <div class="overview-head">
        <h2>All sensors</h2>
        <p class="overview-hint">Edit zone / height / room inline — click a row to compare charts</p>
      </div>
      <div class="model-filters" id="model-filters" role="group" aria-label="Filter by model"></div>
      <div class="category-filters" id="category-filters" aria-label="Filter by category">
        <div class="filter-row" id="zone-filters" role="group" aria-label="Zone"></div>
        <div class="filter-row" id="height-filters" role="group" aria-label="Height"></div>
        <div class="filter-row" id="room-filters" role="group" aria-label="Room"></div>
      </div>
      <div class="overview-table-wrap">
        <table class="overview-table" id="overview-table">
          <thead>
            <tr>
              <th scope="col">
                <button type="button" class="sort-btn" data-sort="name">Sensor</button>
              </th>
              <th scope="col">
                <button type="button" class="sort-btn" data-sort="zone">Zone</button>
              </th>
              <th scope="col">
                <button type="button" class="sort-btn" data-sort="height">Height</button>
              </th>
              <th scope="col">
                <button type="button" class="sort-btn" data-sort="room">Room</button>
              </th>
              <th scope="col" class="num">
                <button type="button" class="sort-btn" data-sort="temperature_c">Temperature</button>
              </th>
              <th scope="col" class="num">
                <button type="button" class="sort-btn" data-sort="humidity">Humidity</button>
              </th>
              <th scope="col" class="num">
                <button type="button" class="sort-btn" data-sort="battery">Battery</button>
              </th>
              <th scope="col">
                <button type="button" class="sort-btn" data-sort="last_source">Source</button>
              </th>
              <th scope="col">
                <button type="button" class="sort-btn" data-sort="last_reading_ts">Last reading</button>
              </th>
            </tr>
          </thead>
          <tbody id="overview-body">
            <tr><td colspan="9" class="overview-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <p class="status" id="overview-status">Loading…</p>
    </section>

    <section id="view-compare" class="view" role="tabpanel" aria-label="Compare" hidden>
      <section class="controls" aria-label="Selection">
        <div class="field field-devices">
          <div class="field-head">
            <span>Devices</span>
            <div class="device-actions">
              <button type="button" id="select-all" class="linkish">All</button>
              <button type="button" id="select-none" class="linkish">None</button>
            </div>
          </div>
          <div class="model-filters model-filters-inline" id="compare-model-filters" role="group" aria-label="Filter by model"></div>
          <div class="category-filters category-filters-inline" id="compare-category-filters" aria-label="Filter by category">
            <div class="filter-row" id="compare-zone-filters" role="group" aria-label="Zone"></div>
            <div class="filter-row" id="compare-height-filters" role="group" aria-label="Height"></div>
            <div class="filter-row" id="compare-room-filters" role="group" aria-label="Room"></div>
          </div>
          <div id="device-list" class="device-list" role="group" aria-label="Devices to compare"></div>
        </div>
        <div class="ranges" role="group" aria-label="Time range">
          <button type="button" data-hours="1">1 h</button>
          <button type="button" data-hours="6">6 h</button>
          <button type="button" data-hours="24" class="active">24 h</button>
          <button type="button" data-hours="168">7 d</button>
        </div>
        <label class="forecast-toggle">
          <input type="checkbox" id="show-forecast" checked>
          <span>Forecast &amp; projections</span>
        </label>
        <button type="button" id="locate-btn" class="linkish locate-btn" title="Use browser location">Locate</button>
        <span class="geo-status" id="geo-status" aria-live="polite"></span>
      </section>

      <section class="current" id="current" aria-live="polite"></section>
      <section class="projections" id="projections" hidden aria-live="polite"></section>

      <section class="charts">
        <figure class="chart-block">
          <figcaption>Temperature (°C)</figcaption>
          <canvas id="temp-chart"></canvas>
        </figure>
        <figure class="chart-block">
          <figcaption>Humidity (%)</figcaption>
          <canvas id="hum-chart"></canvas>
        </figure>
        <figure class="chart-block">
          <figcaption>Dew point (°C)</figcaption>
          <canvas id="dew-chart"></canvas>
        </figure>
      </section>

      <p class="status" id="status">Loading…</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
