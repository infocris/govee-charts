# Door / window contact historization via MQTT (Home Assistant / ring-mqtt).
# Stores open/close timestamps in SQLite for API use.
[doors]
enabled = false
mqtt_host = "127.0.0.1"
mqtt_port = 1883
mqtt_username = "hass"
# Prefer a password file over putting secrets in this template:
# mqtt_password_file = "/path/to/.mqtt_password"
mqtt_password = ""
discovery_prefix = "homeassistant"
ring_topic = "ring/#"
retention_days = 365
# Optional one-shot import of existing HA recorder history:
# ha_db_path = "/path/to/home-assistant_v2.db"
# Optional HA REST poll for contacts not on MQTT (e.g. Tuya door sensors):
# ha_url = "http://127.0.0.1:8123"
# ha_token_file = "/path/to/.ha_token"
# ha_poll_seconds = 10
# ha_entities = ["binary_sensor.door_sensor_porte", "binary_sensor.door_sensor_2_porte"]
# [doors.names]
# "binary_sensor.door_sensor_porte" = "Porte cuisine"
# "binary_sensor.door_sensor_2_porte" = "Porte chambre"

# Person room presence on the Map (HA person tracker / room sensor).
# [presence]
# enabled = true
# ha_url = "http://127.0.0.1:8123"
# ha_token_file = "/path/to/.ha_token"
# poll_seconds = 10
# entity = "sensor.christophe_room"
# label = "Christophe"
# Optional when the HA state is home/not_home and the room is an attribute:
# attribute = "room"
# Optional explicit label → apartment room id (aliases like Chambre→bedroom
# are built-in; override here if needed):
# [presence.rooms]
# "Bureau" = "living"

# HVAC / power historization via Home Assistant REST (Tuya climate + Ecojoko, …).
# Create a long-lived access token in HA: Profile → Security → Long-lived access tokens.
[hvac]
enabled = false
ha_url = "http://127.0.0.1:8123"
# Prefer a token file over putting secrets in this template:
# ha_token_file = "/path/to/.ha_token"
ha_token = ""
climate_entity = "climate.medion_smart_mobile_camping_ac_p502_md37735"
# Apartment room where the unit sits (shown on Network when AC is on):
room = "bedroom"
power_entity = "sensor.infocris_consommation_temps_reel"
# Daily whole-home energy (kWh since midnight) + cumulative water-heater meter:
energy_entity = "sensor.infocris_consommation_reseau"
water_heater_energy_entity = "sensor.compteur_intelligent_wifi_energie_totale"
# Indoor heat model (fractions of electrical energy retained as room heat):
water_heater_indoor_fraction = 0.30
other_loads_indoor_fraction = 0.90
ac_cop = 3.0
ac_idle_floor_w = 150
timezone = "Europe/Paris"
poll_seconds = 15
retention_days = 365
# Optional one-shot import from HA recorder SQLite on startup:
# ha_db_path = "/path/to/home-assistant_v2.db"

# Optional HA temperature / humidity sensors (Tuya T&H, …) stored like Govee devices.
# [ha_th]
# enabled = true
# ha_url = "http://127.0.0.1:8123"
# ha_token_file = "/path/to/.ha_token"
# poll_seconds = 60
# sample_interval = 60
# Seconds without a new HA last_changed before the map treats the sensor as stale.
# Tuya T&H often reports only on 0.5 °C change or ~hourly; 2 h covers night gaps.
# stale_after = 7200
# [[ha_th.devices]]
# address = "HA:SEJOUR-EXT"
# label = "Séjour Ext"
# temperature_entity = "sensor.capteur_t_h_temperature"
# humidity_entity = "sensor.capteur_t_h_humidite"
# battery_entity = "sensor.capteur_t_h_etat_batterie"
# model = "tuya-th"
# zone = "exterior"
# room = "living"

# Recover missing minute history: federation peers first, then optional GATT.
# Single worker; newest windows first (1 h → 24 h → 7 d → deeper day chunks).
# Starts with a local BLE scanner, or with federation_pull + configured peers
# (federation-only when scanner is off). Devices farther than min_rssi are
# deferred for GATT. Per-sensor GATT can be disabled in the Backfill UI.
# With federation: recovered samples are pushed as "{node_id}/gatt"; the node
# with the best recent RSSI for a device does the GATT pull. Before GATT, the
# worker pulls peer /api/history for the gap window (federation_pull).
[backfill]
enabled = true
lookback_days = 20
poll_seconds = 30
max_job_minutes = 60
min_rssi = -75
seen_max_age_seconds = 600
federation_share = true
federation_pull = true
rssi_prefer_margin_db = 3
peer_signal_cache_seconds = 45
rebuild_seconds = 900

# Voice alerts via Home TTS edge (chrome-home-tts on :18765).
# Emit only — sinks are Bridge UI Outputs (Precision / Unmute / Chrome).
# return_audio=true is debug-only (do not use as a sink).
[tts]
home_url = "http://127.0.0.1:18765"
app = "govee-charts"
channel = "alerts"
return_audio = false

# Map-view chat: local Cursor Agent CLI (same login as `agent status`).
# Mode ask = Q&A only (no repo edits). Requires `agent login` as the UI user.
# If systemd PATH lacks ~/.local/bin, set agent_bin to an absolute path.
[cursor_chat]
enabled = true
agent_bin = ""
mode = "ask"
model = "auto"
workspace = ""
timeout_s = 180
# Separate SQLite file (not readings.db) for chat turns + sensor/banner snapshots
db_path = "data/map_chat.db"

# Optional friendly labels keyed by BLE MAC (uppercase).
# Also used to map macOS UUID addresses to real MACs via the Govee name suffix
# (e.g. GVH5075_1270 → A4:C1:38:???:12:70).
# [labels]
# "A4:C1:38:96:F8:A9" = "Salon"
# "1F:64:04:11:60:C4" = "Cave"
