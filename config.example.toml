[server]
host = "127.0.0.1"
port = 8080
# Self-signed HTTPS on ssl_port (HTTP on port stays for federation / compatibility)
ssl = false
ssl_port = 8081
ssl_auto_generate = true
certfile = "data/ssl/cert.pem"
keyfile = "data/ssl/key.pem"

[scanner]
# Set false on a hub that only receives peer data (no local BLE)
enabled = true
# Active scan is required for Govee manufacturer data
active = true
# Min seconds between stored samples per device
sample_interval = 60.0
# Days of history to keep
retention_days = 30
log_file = "govee-charts.log"
# BLE adapters to scan in parallel (empty = system default).
# Plug a 2nd USB dongle near distant sensors → it appears as hci1:
# adapters = ["hci0", "hci1"]
adapters = []
# UI banner when no BLE advertisements for this long (seconds). 0 = off.
alert_stale_after = 300.0

[database]
path = "data/readings.db"

# Per-device readings compaction (min/max/avg rollups for old data).
# Policies are chosen per sensor in System → Sensor storage (default: none).
# Presets: none | balanced | aggressive | archive | adaptive
# adaptive: keep 30d raw; older flat ΔT≤0.3°C stretches → one rollup; keep swings.
# adaptive: keep 30d raw; older flat ΔT≤0.3°C stretches → one rollup; keep swings.
[compaction]
enabled = true
interval_s = 3600
default_policy = "none"
max_delete_per_device = 50000

# Share readings with other Govee Charts instances on the LAN.
# Each node pushes only its locally scanned samples (no re-forward loops).
[federation]
# Unique name for this node (defaults to hostname if empty)
node_id = ""
# Shared secret (same on all peers). Leave empty to disable auth.
token = ""
# Peer base URLs, e.g. ["http://192.168.1.20:8080"]
peers = []

# Outdoor hourly forecast (Open-Meteo) + sensor projections.
# Preferred: browser geolocation. Optional fallback: place="City" or lat/lon.
# Attribution: Open-Meteo.com — cached in data/weather_cache.json
[weather]
enabled = true
place = ""
# latitude = 48.85
# longitude = 2.35
timezone = "Europe/Paris"
cache_seconds = 1800
forecast_hours = 48
# RC projection: fit Δ and τ from sensor history vs outdoor past_days
calib_hours = 48
tau_min_hours = 0.5
tau_max_hours = 24
tau_default_hours = 3

# Optional Météo-France in-situ stations (real measurements, ~24 h retention).
# basic_auth_file: Base64 "client_id:secret" from portail-api.meteofrance.fr
# (same value as Authorization Basic … without the "Basic " prefix).
# Prefer [[weather.meteofrance.stations]]; legacy station_id / station_name still work.
[weather.meteofrance]
enabled = false
basic_auth_file = "data/secrets/meteofrance_basic.b64"
cache_seconds = 300

# [[weather.meteofrance.stations]]
# id = "92073001"
# name = "Suresnes"
# [[weather.meteofrance.stations]]
# id = "75107005"
# name = "Tour Eiffel"
# [[weather.meteofrance.stations]]
# id = "75116008"
# name = "Longchamp"

