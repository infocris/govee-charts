[server]
host = "127.0.0.1"
port = 8080

[scanner]
# Set false on a hub that only receives peer data (no local BLE)
enabled = true
# Active scan is required for Govee manufacturer data
active = true
# Min seconds between stored samples per device
sample_interval = 60.0
# Days of history to keep
retention_days = 30
log_file = "govee-charts.log"
# BLE adapters to scan in parallel (empty = system default).
# Plug a 2nd USB dongle near distant sensors → it appears as hci1:
# adapters = ["hci0", "hci1"]
adapters = []

[database]
path = "data/readings.db"

# Share readings with other Govee Charts instances on the LAN.
# Each node pushes only its locally scanned samples (no re-forward loops).
[federation]
# Unique name for this node (defaults to hostname if empty)
node_id = ""
# Shared secret (same on all peers). Leave empty to disable auth.
token = ""
# Peer base URLs, e.g. ["http://192.168.1.20:8080"]
peers = []

# Optional friendly labels keyed by BLE MAC (uppercase)
# [labels]
# "A4:C1:38:96:F8:A9" = "Salon"
# "1F:64:04:11:60:C4" = "Cave"
