[server]
host = "127.0.0.1"
port = 8080
# Self-signed HTTPS on ssl_port (HTTP on port stays for federation / compatibility)
ssl = false
ssl_port = 8081
ssl_auto_generate = true
certfile = "data/ssl/cert.pem"
keyfile = "data/ssl/key.pem"

[scanner]
# Set false on a hub that only receives peer data (no local BLE)
enabled = true
# Active scan is required for Govee manufacturer data
active = true
# Min seconds between stored samples per device
sample_interval = 60.0
# Days of history to keep
retention_days = 30
log_file = "govee-charts.log"
# BLE adapters to scan in parallel (empty = system default).
# Plug a 2nd USB dongle near distant sensors → it appears as hci1:
# adapters = ["hci0", "hci1"]
adapters = []

[database]
path = "data/readings.db"

# Share readings with other Govee Charts instances on the LAN.
# Each node pushes only its locally scanned samples (no re-forward loops).
[federation]
# Unique name for this node (defaults to hostname if empty)
node_id = ""
# Shared secret (same on all peers). Leave empty to disable auth.
token = ""
# Peer base URLs, e.g. ["http://192.168.1.20:8080"]
peers = []

# Outdoor hourly forecast (Open-Meteo) + sensor projections.
# Preferred: browser geolocation. Optional fallback: place="City" or lat/lon.
# Attribution: Open-Meteo.com — cached in data/weather_cache.json
[weather]
enabled = true
place = ""
# latitude = 48.85
# longitude = 2.35
timezone = "Europe/Paris"
cache_seconds = 1800
forecast_hours = 48
# RC projection: fit Δ and τ from sensor history vs outdoor past_days
calib_hours = 48
tau_min_hours = 0.5
tau_max_hours = 24
tau_default_hours = 3

# Multi-room RC network (corridor hub). Maps device.room → node.
# Set enabled = true when sensors have room categories assigned.
[apartment]
enabled = false
ceiling_m = 2.5
area_m2 = 35.0
floor = 3
floors_total = 7
timezone = "Europe/Paris"

[[apartment.rooms]]
id = "bedroom"
area_m2 = 10.9
exterior = ["ne"]
label = "Bedroom"

[[apartment.rooms]]
id = "living"
area_m2 = 10.8
exterior = ["sw"]
label = "Living room"

[[apartment.rooms]]
id = "kitchen"
area_m2 = 5.6
exterior = ["sw"]
label = "Kitchen"

[[apartment.rooms]]
id = "corridor"
area_m2 = 4.0
exterior = []
label = "Corridor"

[[apartment.rooms]]
id = "bathroom"
area_m2 = 2.5
exterior = []
label = "Bathroom"

[[apartment.rooms]]
id = "wc"
area_m2 = 1.2
exterior = []
label = "WC"

[[apartment.edges]]
a = "corridor"
b = "bedroom"
kind = "door"

[[apartment.edges]]
a = "corridor"
b = "living"
kind = "door"

[[apartment.edges]]
a = "corridor"
b = "kitchen"
kind = "door"

[[apartment.edges]]
a = "corridor"
b = "bathroom"
kind = "door"

[[apartment.edges]]
a = "corridor"
b = "wc"
kind = "door"

[[apartment.edges]]
a = "kitchen"
b = "living"
kind = "wall_partial"

[[apartment.edges]]
a = "kitchen"
b = "wc"
kind = "wall"

[[apartment.edges]]
a = "living"
b = "wc"
kind = "wall"

[[apartment.edges]]
a = "bedroom"
b = "bathroom"
kind = "wall"

# Door / window contact historization via MQTT (Home Assistant / ring-mqtt).
# Stores open/close timestamps in SQLite for API use.
[doors]
enabled = false
mqtt_host = "127.0.0.1"
mqtt_port = 1883
mqtt_username = "hass"
# Prefer a password file over putting secrets in this template:
# mqtt_password_file = "/path/to/.mqtt_password"
mqtt_password = ""
discovery_prefix = "homeassistant"
ring_topic = "ring/#"
retention_days = 365
# Optional one-shot import of existing HA recorder history:
# ha_db_path = "/path/to/home-assistant_v2.db"

# HVAC / power historization via Home Assistant REST (Tuya climate + Ecojoko, …).
# Create a long-lived access token in HA: Profile → Security → Long-lived access tokens.
[hvac]
enabled = false
ha_url = "http://127.0.0.1:8123"
# Prefer a token file over putting secrets in this template:
# ha_token_file = "/path/to/.ha_token"
ha_token = ""
climate_entity = "climate.medion_smart_mobile_camping_ac_p502_md37735"
power_entity = "sensor.infocris_consommation_temps_reel"
poll_seconds = 15
retention_days = 365
# Optional one-shot import from HA recorder SQLite on startup:
# ha_db_path = "/path/to/home-assistant_v2.db"

# Optional friendly labels keyed by BLE MAC (uppercase).
# Also used to map macOS UUID addresses to real MACs via the Govee name suffix
# (e.g. GVH5075_1270 → A4:C1:38:???:12:70).
# [labels]
# "A4:C1:38:96:F8:A9" = "Salon"
# "1F:64:04:11:60:C4" = "Cave"
